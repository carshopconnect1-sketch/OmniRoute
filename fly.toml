# fly.toml app configuration file generated for oroute on 2026-03-20T09:12:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'acc-omniroute-connect369'
primary_region = 'nrt'

[build]
  image = 'docker.io/diegosouzapw/omniroute:3.8.50'

[processes]
  app = 'node dev/run-standalone.mjs'

[deploy]
#  release_command = "node ./dbsetup.js"

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[env]
  TZ = "Asia/Tokyo"
  DATA_DIR = "/data"
  NEXT_PUBLIC_BASE_URL = "https://acc-omniroute-connect369.fly.dev"
  
  # Bind to all interfaces for Fly runtime networking.
  HOST = "0.0.0.0"
  HOSTNAME = "0.0.0.0"
  BIND = "0.0.0.0"
