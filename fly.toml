# fly.toml app configuration file generated for acc-omniroute-connect369 on 2026-08-28T17:45:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'acc-omniroute-connect369'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile.fly'

[deploy]

[env]
  BIND = '0.0.0.0'
  DATA_DIR = '/data'
  HOST = '0.0.0.0'
  HOSTNAME = '0.0.0.0'
  NEXT_PUBLIC_BASE_URL = 'https://acc-omniroute-connect369.fly.dev'
  TZ = 'Asia/Tokyo'

[processes]
  app = 'node dev/run-standalone.mjs'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 20128
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
